[project]
name = "twb-lint"
version = "0.0.1"
description = "Mandatory offline validation gate for Tableau .twb/.twbx files — syntactic (XSD) + semantic linting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2",
    "lxml>=5.0",
]

[project.optional-dependencies]
# rule ④ (메타↔hyper 대조, 2차) — hyperapi는 MVP 크리티컬패스 아님
hyper = ["tableauhyperapi>=0.0.19000"]
# 구조 파싱 보조 (선택)
docapi = ["tableaudocumentapi>=0.11"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
twb-lint = "twb_lint.cli:main"
twb-lint-mcp = "twb_lint.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twb_lint"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# tests·tools도 검사한다 (mypy는 packages와 files를 동시에 못 받는다).
# 테스트에 타입 오류가 있으면 **의도한 것을 검사하지 못하고 있을 수 있다** —
# 실제로 범위를 넓혔더니 죽은 `type: ignore` 2건이 드러났다.
files = ["src", "tests", "tools"]
strict = true

[[tool.mypy.overrides]]
module = ["lxml.*", "mcp.*", "tableauhyperapi.*", "tableaudocumentapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# stub 상태의 사실을 단언하는 테스트. 실로직이 들어오면 깨져야 하며,
# 그때 고칠 것은 코드가 아니라 테스트다. 부채를 grep 가능하게 표시해 둔다.
markers = ["stub: scaffolding stub의 동작을 고정한 테스트 (구현 시 교체 대상)"]
